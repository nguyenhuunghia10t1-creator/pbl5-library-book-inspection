name: Báo lỗi
description: Ghi nhận lỗi có thể tái hiện trong một module.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [OpenCV, Firmware, Software, AI, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Cách tái hiện
      description: Lệnh chạy, đầu vào và các bước dẫn tới lỗi.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Kết quả thực tế và mong đợi
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường và bằng chứng
      description: Phiên bản phần mềm, thiết bị, log hoặc ảnh đã loại thông tin riêng.
