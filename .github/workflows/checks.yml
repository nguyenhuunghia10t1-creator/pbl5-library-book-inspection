name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-inspection.txt
            vision/opencv/requirements.txt
      - run: python -m pip install -r requirements-inspection.txt httpx
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/web/station_ui.test.js
